# Production Environment Properties
server.port=8080

# Database Configuration (Uses env variables with fallbacks)
spring.datasource.url=jdbc:mysql://${DB_HOST:prod-db}:${DB_PORT:3306}/${DB_NAME:task_db}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate (Automatically create/update schema on startup)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# JWT Security Settings (Loaded securely from environment)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
